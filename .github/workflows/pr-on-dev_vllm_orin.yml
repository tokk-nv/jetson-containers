name: VLLM dev branch Jetson AGX Orin 64GB

on:
  push:
    branches: [ dev ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      fork_repo:
        description: 'Fork repository (e.g., tokk-nv/jetson-containers)'
        required: false
        type: string
      fork_branch:
        description: 'Branch from fork to test (e.g., dev)'
        required: false
        type: string
        default: 'dev'

jobs:
  test-package-orin:
    runs-on: [self-hosted, linux, arm64, jetson, orin]
    name: "Package Build Test (Jetson AGX Orin 64GB)"

    steps:
      - name: Pre-checkout cleanup
        run: |
          echo "=== Pre-checkout Cleanup ==="
          echo "Cleaning up permission-restricted files before checkout..."
          sudo rm -rf /home/jetson/actions-runner/_work/jetson-containers/jetson-containers/data || echo "Data cleanup completed"
          sudo rm -rf /home/jetson/actions-runner/_work/jetson-containers/jetson-containers/logs || echo "Logs cleanup completed"
          echo "Pre-checkout cleanup completed"

      - name: Checkout PR or Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.fork_repo != '' && inputs.fork_repo || github.repository }}
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.fork_branch != '' && inputs.fork_branch || 'dev') || github.ref }}

      - name: Display system info
        run: bash .github/workflows/scripts/step-system-info.sh

      - name: Record environment variables
        run: bash .github/workflows/scripts/step-env-info.sh

      - name: Clean environment for fresh build
        run: bash .github/workflows/scripts/step-clean-environment.sh

      - name: Show git repository state
        run: bash .github/workflows/scripts/step-git-status.sh

      - name: Detect changed packages
        id: detect-packages
        run: |
          BASE_REF="${{ github.event_name == 'pull_request' && github.base_ref || 'dev' }}" bash .github/workflows/scripts/detect_changed_packages.sh
          packages_json=$(BASE_REF="${{ github.event_name == 'pull_request' && github.base_ref || 'dev' }}" bash .github/workflows/scripts/detect_changed_packages.sh)
          echo "packages_json=$packages_json"
          # Convert JSON array to space-separated string
          packages_string=$(echo "$packages_json" | jq -r '.[]' | tr '\n' ' ' | sed 's/ $//')
          echo "packages_string=$packages_string"
          # Count packages
          packages_count=$(echo "$packages_json" | jq '. | length')
          echo "packages_count=$packages_count"
          
          echo ""
          echo "=========================================="
          echo "📦 DETECTED PACKAGES TO BUILD"
          echo "=========================================="
          echo "Count: $packages_count package(s)"
          echo "Packages: $packages_string"
          echo "=========================================="
          echo ""
          
          echo "packages=$packages_string" >> $GITHUB_OUTPUT
          echo "packages_count=$packages_count" >> $GITHUB_OUTPUT

      - name: Test build packages on orin
        id: package-test
        run: bash .github/workflows/scripts/step-build-package.sh ${{ steps.detect-packages.outputs.packages }}

      - name: Analyze build results
        if: always()
        run: bash .github/workflows/scripts/step-analyze-results.sh ${{ steps.detect-packages.outputs.packages }} ${{ steps.package-test.outputs.stage1 }} ${{ steps.package-test.outputs.stage2 }} ${{ steps.package-test.outputs.build_status }}

      - name: Test build results
        run: bash .github/workflows/scripts/step-test-results-summary.sh ${{ steps.detect-packages.outputs.packages }} ${{ steps.package-test.outputs.stage1 }} ${{ steps.package-test.outputs.stage2 }} ${{ steps.package-test.outputs.build_status }} ${{ steps.package-test.outputs.failure_phase }} ${{ steps.package-test.outputs.failure_stage }} ${{ steps.package-test.outputs.failure_component }}
