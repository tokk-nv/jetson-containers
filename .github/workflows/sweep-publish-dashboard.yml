name: Sweep - Publish Dashboard

on:
  workflow_run:
    workflows: ["Sweep – Build Matrix"]
    types: [completed]
    branches: [dev]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  deployments: write

jobs:
  publish-dashboard:
    name: Publish Dashboard
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current sweep results and logs
        env:
          DASHBOARD_PAT: ${{ secrets.DASHBOARD_PAT }}
        run: |
          python3 - << 'EOF'
          import requests
          import json
          import os
          import zipfile
          import shutil

          # Get current run info
          dashboard_pat = os.environ.get('DASHBOARD_PAT')
          github_token = os.environ.get('GITHUB_TOKEN')
          token = dashboard_pat or github_token
          repo = os.environ.get('GITHUB_REPOSITORY')
          current_run_id = "${{ github.event.workflow_run.id }}"
          current_sha = "${{ github.event.workflow_run.head_sha }}"
          current_attempt = "${{ github.event.workflow_run.run_attempt }}"

          print(f"🔍 Token debugging for current run download:")
          print(f"   DASHBOARD_PAT exists: {dashboard_pat is not None}")
          print(f"   GITHUB_TOKEN exists: {github_token is not None}")
          print(f"   Using token: {'DASHBOARD_PAT' if dashboard_pat else 'GITHUB_TOKEN'}")

          headers = {'Authorization': f'token {token}'}

          print(f"🔍 Downloading artifacts from current run {current_run_id}")
          print(f"   SHA: {current_sha}, Attempt: {current_attempt}")

          # Get all artifacts from current run
          artifacts_url = f'https://api.github.com/repos/{repo}/actions/runs/{current_run_id}/artifacts'
          response = requests.get(artifacts_url, headers=headers)

          if response.status_code != 200:
              print(f"❌ Failed to get artifacts: {response.status_code}")
              exit(1)

          artifacts = response.json().get('artifacts', [])
          print(f"📋 Found {len(artifacts)} total artifacts for current run:")

          # Create directories
          os.makedirs('./results-data', exist_ok=True)
          os.makedirs('./logs/run-current', exist_ok=True)

          merged_results = []

          for artifact in artifacts:
              print(f"  - {artifact['name']} ({artifact['size_in_bytes']} bytes)")

              # Download final merged results
              if artifact['name'] == f"sweep-results-{current_sha}-{current_attempt}":
                  print(f"    📥 Downloading merged results...")
                  download_url = f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact['id']}/zip"
                  download_response = requests.get(download_url, headers=headers)

                  if download_response.status_code == 200:
                      with open('./results-data/results.zip', 'wb') as f:
                          f.write(download_response.content)

                      with zipfile.ZipFile('./results-data/results.zip', 'r') as zip_ref:
                          zip_ref.extractall('./results-data')

                      os.remove('./results-data/results.zip')
                      print(f"    ✅ Merged results downloaded")
                  else:
                      print(f"    ❌ Failed to download merged results: {download_response.status_code}")

              # Download chunk artifacts (contain logs)
              elif artifact['name'].startswith('results-') and '-chunk-' in artifact['name'] and artifact['name'].endswith(f'-{current_attempt}'):
                  print(f"    📥 Downloading chunk artifact with logs...")
                  download_url = f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact['id']}/zip"
                  download_response = requests.get(download_url, headers=headers)

                  if download_response.status_code == 200:
                      # Extract platform info from artifact name
                      # Format: results-{platform}-chunk-{index}-{attempt}
                      parts = artifact['name'].split('-')
                      platform = parts[1] if len(parts) > 1 else 'unknown'
                      chunk_index = parts[3] if len(parts) > 3 else '000'

                      artifact_path = f'./temp-{artifact["id"]}.zip'
                      with open(artifact_path, 'wb') as f:
                          f.write(download_response.content)

                      with zipfile.ZipFile(artifact_path, 'r') as zip_ref:
                          zip_ref.extractall(f'./temp-{artifact["id"]}')

                      # Move log files with unique names
                      temp_dir = f'./temp-{artifact["id"]}'
                      for root, dirs, files in os.walk(temp_dir):
                          for file in files:
                              if file.endswith('.log'):
                                  src = os.path.join(root, file)
                                  # Create unique filename with platform
                                  base_name, ext = os.path.splitext(file)
                                  unique_name = f"{base_name}_{platform}{ext}"
                                  dst = os.path.join('./logs/run-current', unique_name)
                                  print(f"    📝 Moving log: {file} -> {unique_name}")
                                  shutil.move(src, dst)

                      # Clean up
                      os.remove(artifact_path)
                      shutil.rmtree(temp_dir)
                      print(f"    ✅ Chunk logs processed for {platform}")
                  else:
                      print(f"    ❌ Failed to download chunk: {download_response.status_code}")

          print(f"✅ Current run artifact download complete")

          # List what we got
          print(f"\n📁 Downloaded files:")
          if os.path.exists('./results-data/results.json'):
              print(f"  ✅ ./results-data/results.json")
          else:
              print(f"  ❌ ./results-data/results.json missing")

          if os.path.exists('./logs/run-current'):
              log_files = os.listdir('./logs/run-current')
              print(f"  📝 Log files ({len(log_files)}):")
              for log_file in log_files:
                  print(f"    - {log_file}")
          else:
              print(f"  ❌ No log files found")
          EOF

      - name: Download recent sweep results (with PAT support)
        env:
          DASHBOARD_PAT: ${{ secrets.DASHBOARD_PAT }}
        run: |
          echo "🔍 Testing cross-repository access for historical runs..."
          echo "   Current repository: $GITHUB_REPOSITORY"
          echo "   Triggered by: $GITHUB_EVENT_NAME"
          echo ""

          # Test secret access first
          if [ -n "$DASHBOARD_PAT" ]; then
            echo "✅ DASHBOARD_PAT is accessible (length: ${#DASHBOARD_PAT})"
          else
            echo "❌ DASHBOARD_PAT is not accessible"
          fi
          echo ""

          python3 - << 'EOF'
          import requests
          import json
          import os

          # Try to use PAT first (for API access), fallback to GITHUB_TOKEN
          dashboard_pat = os.environ.get('DASHBOARD_PAT')
          github_token = os.environ.get('GITHUB_TOKEN')
          token = dashboard_pat or github_token
          current_repo = os.environ.get('GITHUB_REPOSITORY')

          print(f"🔍 Token debugging:")
          print(f"   DASHBOARD_PAT exists: {dashboard_pat is not None}")
          print(f"   GITHUB_TOKEN exists: {github_token is not None}")
          print(f"   Using token: {'DASHBOARD_PAT' if dashboard_pat else 'GITHUB_TOKEN'}")
          print(f"   Token length: {len(token) if token else 0}")
          print(f"   Token prefix: {token[:10]}..." if token else "No token")
          print(f"   Repository: {current_repo}")
          print(f"   Event: {os.environ.get('GITHUB_EVENT_NAME')}")
          print(f"   Actor: {os.environ.get('GITHUB_ACTOR')}")
          print()

          headers = {'Authorization': f'token {token}'}

          # Focus on upstream since that's where workflows run
          possible_repos = [
              current_repo,  # Should be NVIDIA-AI-IOT/jetson-containers
          ]

          print(f"🔍 Will test access to repositories:")
          for repo in possible_repos:
              print(f"   - {repo}")
          print()

          runs = []
          successful_repo = None

          for repo in possible_repos:
              print(f"🔄 Testing repository: {repo}")

              # First, test basic repo access
              repo_url = f'https://api.github.com/repos/{repo}'
              repo_response = requests.get(repo_url, headers=headers)
              print(f"   Basic repo access: {repo_response.status_code}")

              # Then test workflow file access
              workflow_url = f'https://api.github.com/repos/{repo}/actions/workflows/sweep-build-matrix.yml'
              workflow_response = requests.get(workflow_url, headers=headers)
              print(f"   Workflow file access: {workflow_response.status_code}")

              # Finally test workflow runs
              url = f'https://api.github.com/repos/{repo}/actions/workflows/sweep-build-matrix.yml/runs'
              params = {'per_page': 15}  # Fetch more runs for better historical timeline

              print(f"   Testing workflow runs API...")
              print(f"   URL: {url}")
              print(f"   Params: {params}")

              response = requests.get(url, headers=headers, params=params)
              print(f"   Workflow runs status: {response.status_code}")

              if response.status_code == 200:
                  repo_runs = response.json().get('workflow_runs', [])
                  print(f"   ✅ Success! Found {len(repo_runs)} total workflow runs")

                  if len(repo_runs) > 0:
                      # Show run details
                      print(f"   📊 Recent runs:")
                      for i, run in enumerate(repo_runs[:5]):
                          print(f"      {i+1}. ID: {run['id']}, Status: {run['status']}, Branch: {run['head_branch']}")

                      # Filter for completed runs
                      completed_runs = [r for r in repo_runs if r['status'] in ['completed', 'success', 'failure']]
                      print(f"   🎯 Completed runs: {len(completed_runs)}")

                      if completed_runs:
                          runs = completed_runs[:10]  # Process up to 10 recent runs
                          successful_repo = repo
                          break
                  else:
                      print(f"   ⚠️  No workflow runs found at all")
              else:
                  print(f"   ❌ Error: {response.status_code}")
                  try:
                      error_detail = response.json()
                      print(f"   Error details: {error_detail}")
                  except:
                      print(f"   Error text: {response.text[:200]}")

          if successful_repo:
              print(f"\n🎯 Found workflow runs in: {successful_repo}")
              print(f"📊 Will process {len(runs)} recent runs for timeline")

              # Create runs directory and process a few runs
              os.makedirs('./runs', exist_ok=True)

              for i, run in enumerate(runs):
                  run_id = run['id']
                  sha = run['head_sha']
                  run_attempt = run['run_attempt']
                  print(f"   Processing run {i+1}: {run_id} (SHA: {sha[:8]})")

                  # Download the sweep results artifact for this run
                  artifacts_url = f'https://api.github.com/repos/{current_repo}/actions/runs/{run_id}/artifacts'
                  artifacts_response = requests.get(artifacts_url, headers=headers)

                  if artifacts_response.status_code == 200:
                      artifacts = artifacts_response.json().get('artifacts', [])

                      # Find the sweep results artifact
                      sweep_artifact = None
                      for artifact in artifacts:
                          if artifact['name'].startswith(f'sweep-results-{sha}'):
                              sweep_artifact = artifact
                              break

                      if sweep_artifact:
                          print(f"     Found artifact: {sweep_artifact['name']}")

                          # Download the artifact
                          download_url = f"https://api.github.com/repos/{current_repo}/actions/artifacts/{sweep_artifact['id']}/zip"
                          download_response = requests.get(download_url, headers=headers)

                          if download_response.status_code == 200:
                              # Save and extract the artifact
                              import zipfile
                              artifact_path = f'./temp-{run_id}.zip'
                              with open(artifact_path, 'wb') as f:
                                  f.write(download_response.content)

                              # Extract and move results.json
                              with zipfile.ZipFile(artifact_path, 'r') as zip_ref:
                                  zip_ref.extractall(f'./temp-{run_id}')

                              # Find and move the results.json file
                              import shutil
                              temp_results = f'./temp-{run_id}/results.json'
                              if os.path.exists(temp_results):
                                  final_path = f'./runs/results-{run_id}.json'
                                  shutil.move(temp_results, final_path)
                                  print(f"     ✅ Saved results-{run_id}.json")
                              else:
                                  print(f"     ❌ No results.json found in artifact")

                              # Clean up
                              os.remove(artifact_path)
                              shutil.rmtree(f'./temp-{run_id}')

                              # Now download log artifacts for this run
                              print(f"     🔍 Looking for log artifacts...")
                              print(f"     📋 All available artifacts for run {run_id}:")
                              for art in artifacts:
                                  print(f"       - {art['name']} (size: {art.get('size_in_bytes', 'unknown')})")

                              log_artifacts = [a for a in artifacts if 'chunk-' in a['name'] and a['name'].startswith('results-')]

                              if log_artifacts:
                                  print(f"     📋 Found {len(log_artifacts)} log artifacts")
                                  run_logs_dir = f'./logs/run-{run_id}'
                                  os.makedirs(run_logs_dir, exist_ok=True)

                                  for log_artifact in log_artifacts[:5]:  # Limit to first 5 to avoid timeout
                                      print(f"       Downloading {log_artifact['name']}")
                                      log_download_url = f"https://api.github.com/repos/{current_repo}/actions/artifacts/{log_artifact['id']}/zip"
                                      log_download_response = requests.get(log_download_url, headers=headers)

                                      if log_download_response.status_code == 200:
                                          log_artifact_path = f'./temp-log-{log_artifact["id"]}.zip'
                                          with open(log_artifact_path, 'wb') as f:
                                              f.write(log_download_response.content)

                                          # Extract log files
                                          with zipfile.ZipFile(log_artifact_path, 'r') as zip_ref:
                                              zip_ref.extractall(f'./temp-log-{log_artifact["id"]}')

                                          # Move log files to run directory
                                          temp_log_dir = f'./temp-log-{log_artifact["id"]}'
                                          print(f"       📂 Extracting from: {temp_log_dir}")
                                          for root, dirs, files in os.walk(temp_log_dir):
                                              print(f"         📁 Directory: {root}")
                                              print(f"         📄 Files: {files}")
                                              for file in files:
                                                  if file.endswith('.log'):
                                                      src = os.path.join(root, file)
                                                      dst = os.path.join(run_logs_dir, file)
                                                      print(f"         📝 Moving log: {src} → {dst}")
                                                      shutil.move(src, dst)
                                                  else:
                                                      print(f"         ⚠️  Skipping non-log file: {file}")

                                          # Clean up log temp files
                                          os.remove(log_artifact_path)
                                          shutil.rmtree(temp_log_dir)
                                      else:
                                          print(f"       ❌ Failed to download log: {log_download_response.status_code}")

                                  # Count log files downloaded and list them
                                  log_files = [f for f in os.listdir(run_logs_dir) if f.endswith('.log')]
                                  log_count = len(log_files)
                                  print(f"     ✅ Downloaded {log_count} log files for run {run_id}")
                                  print(f"     📋 Log files created:")
                                  for log_file in log_files:
                                      full_path = os.path.join(run_logs_dir, log_file)
                                      file_size = os.path.getsize(full_path)
                                      print(f"       - {log_file} ({file_size} bytes)")
                              else:
                                  print(f"     ⚠️  No log artifacts found for run {run_id}")
                          else:
                              print(f"     ❌ Failed to download artifact: {download_response.status_code}")
                      else:
                          print(f"     ❌ No sweep results artifact found")
                  else:
                      print(f"     ❌ Failed to get artifacts: {artifacts_response.status_code}")

          else:
              if dashboard_pat:
                  print(f"\n❌ No accessible repository found even with DASHBOARD_PAT")
                  print(f"   Please check:")
                  print(f"   1. PAT has 'actions:read' scope")
                  print(f"   2. PAT has access to {current_repo}")
                  print(f"   3. Workflow runs exist in the repository")
              else:
                  print(f"\n❌ No accessible repository found with GITHUB_TOKEN")
                  print(f"   Root cause: workflow_run trigger has limited API permissions")
                  print()
                  print(f"🔧 To enable historical runs timeline:")
                  print(f"   1. Create Personal Access Token with 'actions:read' scope")
                  print(f"   2. Add as repository secret named 'DASHBOARD_PAT'")
                  print(f"   3. Re-run workflow to access historical data")
                  print(f"   4. Timeline will show last 10 workflow runs with full details")

              os.makedirs('./runs', exist_ok=True)

          print(f"\nCompleted repository access test")
          EOF

      - name: Check if results.json exists
        id: check-results
        run: |
          if [ -f "./results-data/results.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Current results file found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No current results file found"
          fi

      - name: Download and process log files
        if: steps.check-results.outputs.exists == 'true'
        run: |
          python3 - << 'EOF'
          import requests
          import json
          import os
          import zipfile
          from datetime import datetime

          # GitHub API token
          token = os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY')
          headers = {'Authorization': f'token {token}'}

          # Create logs directory
          os.makedirs('./logs', exist_ok=True)

          # Process each run directory
          runs_dir = './runs'
          if os.path.exists(runs_dir):
              for filename in os.listdir(runs_dir):
                  if filename.startswith('results-') and filename.endswith('.json'):
                      run_id = filename.replace('results-', '').replace('.json', '')
                      print(f"Processing logs for run {run_id}")

                      # Get artifacts for this run
                      artifacts_url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts'
                      artifacts_response = requests.get(artifacts_url, headers=headers)
                      artifacts = artifacts_response.json().get('artifacts', [])

                      # Debug: List ALL artifacts for this run
                      print(f"  📋 Available artifacts for run {run_id}:")
                      for artifact in artifacts:
                          print(f"    - Name: {artifact['name']}, Size: {artifact['size_in_bytes']} bytes")

                      if not artifacts:
                          print(f"    ❌ No artifacts found at all for run {run_id}")
                          continue

                      # Find chunk results artifacts (these contain the logs)
                      chunk_artifacts = [a for a in artifacts if a['name'].startswith('results-') and 'chunk-' in a['name']]

                      # If no chunk artifacts, try broader search for log-containing artifacts
                      if not chunk_artifacts:
                          # Look for any artifact that might contain logs
                          log_artifacts = [a for a in artifacts if 'results-' in a['name'] or 'logs-' in a['name'] or 'chunk' in a['name'].lower()]
                          print(f"  🔍 No 'chunk-' artifacts found, trying broader search...")
                          print(f"  📦 Potential log artifacts: {[a['name'] for a in log_artifacts]}")
                          chunk_artifacts = log_artifacts

                      if chunk_artifacts:
                          print(f"  Found {len(chunk_artifacts)} chunk artifacts")

                          # Create run-specific logs directory
                          run_logs_dir = f'./logs/run-{run_id}'
                          os.makedirs(run_logs_dir, exist_ok=True)

                          for artifact in chunk_artifacts:
                              print(f"    Downloading {artifact['name']}")

                              # Download artifact
                              download_url = f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact['id']}/zip"
                              download_response = requests.get(download_url, headers=headers)

                              if download_response.status_code == 200:
                                  # Save and extract artifact
                                  artifact_path = f'./temp-{artifact["id"]}.zip'
                                  with open(artifact_path, 'wb') as f:
                                      f.write(download_response.content)

                                  with zipfile.ZipFile(artifact_path, 'r') as zip_ref:
                                      zip_ref.extractall(f'./temp-{artifact["id"]}')

                                  # Copy log files to run logs directory with unique names
                                  temp_dir = f'./temp-{artifact["id"]}'
                                  artifact_name = artifact['name']
                                  print(f"    Processing artifact: {artifact_name}")

                                  for root, dirs, files in os.walk(temp_dir):
                                      for file in files:
                                          if file.endswith('.log') or file.startswith('index_'):
                                              src = os.path.join(root, file)

                                              # Make filename unique by including artifact info
                                              # Extract runner info from artifact name (e.g., results-build-essential-orin-chunk-001)
                                              base_name, ext = os.path.splitext(file)
                                              if 'orin' in artifact_name.lower():
                                                  unique_file = f"{base_name}_orin{ext}"
                                              elif 'thor' in artifact_name.lower():
                                                  unique_file = f"{base_name}_thor{ext}"
                                              else:
                                                  # Fallback: use part of artifact name
                                                  parts = artifact_name.split('-')
                                                  if len(parts) > 3:
                                                      runner_hint = parts[3] if parts[3] not in ['chunk'] else parts[2]
                                                      unique_file = f"{base_name}_{runner_hint}{ext}"
                                                  else:
                                                      unique_file = file

                                              dst = os.path.join(run_logs_dir, unique_file)
                                              print(f"    Moving log file: {src} -> {dst} (from artifact: {artifact_name})")
                                              os.makedirs(os.path.dirname(dst), exist_ok=True)
                                              os.rename(src, dst)

                                  # Clean up
                                  os.remove(artifact_path)
                                  import shutil
                                  shutil.rmtree(temp_dir)
                              else:
                                  print(f"    ❌ Failed to download {artifact['name']}: {download_response.status_code}")
                      else:
                          print(f"  ❌ No chunk artifacts found for run {run_id}")

          print("Completed processing log files")
          EOF

      - name: Generate dashboard HTML
        if: steps.check-results.outputs.exists == 'true'
        run: |
          python3 - << 'EOF'
          import json
          import os
          from datetime import datetime

          # Load current results
          with open('./results-data/results.json', 'r') as f:
              current_results = json.load(f)

          # Get current run info
          current_run_id = current_results[0]['run_id'] if current_results else 'unknown'
          current_run_url = current_results[0]['run_url'] if current_results else '#'
          current_sha = current_results[0]['sha'] if current_results else 'unknown'
          current_timestamp = current_results[0]['timestamp'] if current_results else 0

          # Load available runs
          available_runs = []
          runs_dir = './runs'
          print(f"Looking for historical runs in: {runs_dir}")
          if os.path.exists(runs_dir):
              files = os.listdir(runs_dir)
              results_files = [f for f in files if f.startswith('results-') and f.endswith('.json')]
              print(f"Found {len(files)} total files, {len(results_files)} results files: {results_files}")
              for filename in results_files:
                      run_id = filename.replace('results-', '').replace('.json', '')
                      try:
                          with open(os.path.join(runs_dir, filename), 'r') as f:
                              run_data = json.load(f)
                          if run_data:
                              available_runs.append({
                                  'run_id': run_id,
                                  'sha': run_data[0]['sha'],
                                  'timestamp': run_data[0]['timestamp'],
                                  'total': len(run_data),
                                  'success': sum(1 for r in run_data if r['status'] == 'success'),
                                  'failed': sum(1 for r in run_data if r['status'] == 'build_fail'),
                                  'timeout': sum(1 for r in run_data if r['status'] == 'timeout'),
                                  'oom': sum(1 for r in run_data if r['status'] == 'oom_killed')
                              })
                      except Exception as e:
                          print(f"Error loading {filename}: {e}")

          # Sort runs by timestamp (newest first)
          available_runs.sort(key=lambda x: x['timestamp'], reverse=True)

          print(f"✅ Found {len(available_runs)} available runs for timeline")
          if len(available_runs) == 0:
              print("❌ No historical runs available - timeline will only show current run")
              print("This is normal for the first few runs until we build up history")
          else:
              print(f"📊 Timeline will show: {[r['run_id'] for r in available_runs[:5]]}...")
          print(f"🎯 Total runs that will appear in dashboard: {len(available_runs) + 1}")  # +1 for current

          # Debug: Show log_relpath values from current results
          print(f"🔍 Debug: Current results log_relpath values:")
          for i, result in enumerate(current_results[:3]):
              log_path = result.get('log_relpath', 'N/A')
              runner = result.get('runner_label', result.get('runner', 'unknown'))
              print(f"  {i+1}. {result['package']} ({runner}): {log_path}")

          # Generate HTML that dynamically loads results.json (like the existing results.html)
          html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Jetson Containers Build Dashboard</title>
              <style>
                  body {{
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      margin: 0;
                      padding: 20px;
                      background-color: #f5f5f5;
                  }}

                  .container {{
                      max-width: 1400px;
