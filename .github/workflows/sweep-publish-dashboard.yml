name: Sweep - Publish Dashboard

on:
  workflow_run:
    workflows: ["Sweep – Build Matrix"]
    types: [completed]
    branches: [dev]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  deployments: write

jobs:
  publish-dashboard:
    name: Publish Dashboard
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}

    steps:
      - name: Check workflow run status
        run: |
          echo "🔍 Matrix workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "📊 Matrix workflow status: ${{ github.event.workflow_run.status }}"
          echo "🎯 Dashboard will run regardless of matrix workflow conclusion"
          echo "✅ This ensures dashboard is published even if some matrix jobs timeout"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current and historical sweep results
        env:
          DASHBOARD_PAT: ${{ secrets.DASHBOARD_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.event.workflow_run.id }}
          CURRENT_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPO: NVIDIA-AI-IOT/jetson-containers
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "🔍 Downloading current and historical sweep results..."
          echo "   Matrix workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "   Matrix workflow status: ${{ github.event.workflow_run.status }}"

          # Test secret access first
          if [ -n "$DASHBOARD_PAT" ]; then
            echo "✅ DASHBOARD_PAT is accessible (length: ${#DASHBOARD_PAT})"
          else
            echo "❌ DASHBOARD_PAT is not accessible"
          fi
          echo ""

          # Try to download current run artifacts first
          echo "📥 Attempting to download current run artifacts..."
          if python3 .github/workflows/scripts/dashboard_download_current_artifacts.py; then
            echo "✅ Successfully downloaded current run artifacts"
          else
            echo "⚠️ No current run artifacts available (workflow may have been cancelled)"
            echo "   This is expected when the Build Matrix workflow is cancelled"
          fi

          # Download historical runs (this will include current run if available)
          echo "📥 Downloading historical runs..."
          python3 .github/workflows/scripts/dashboard_download_historical_runs.py

      - name: Download and process log files
        env:
          DASHBOARD_PAT: ${{ secrets.DASHBOARD_PAT }}
          REPO: NVIDIA-AI-IOT/jetson-containers
        run: |
          echo "📊 Processing log files..."
          python3 .github/workflows/scripts/dashboard_process_log_files.py

      - name: Convert logs to HTML
        run: |
          echo "🔄 Converting log files to HTML for better web viewing..."
          python3 .github/workflows/scripts/log_to_html_converter.py ./logs/
          echo "✅ Log conversion completed"

      - name: Generate dashboard HTML
        run: |
          echo "🔄 Generating dashboard HTML..."
          echo "   Dashboard will work with any combination of current and historical data"
          python3 .github/workflows/scripts/dashboard_generate_html.py

      - name: Generate markdown report
        run: |
          echo "🔄 Generating markdown report..."
          python3 .github/workflows/scripts/dashboard_generate_report.py

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v4
        with:
          enablement: true
        continue-on-error: true

      - name: Prepare Pages directory
        if: always()
        run: |
          mkdir -p ./pages

          # Copy dashboard HTML (either generated or fallback)
          if [ -f "dashboard.html" ]; then
            cp dashboard.html ./pages/index.html
            echo "✅ Copied dashboard.html to index.html"
          else
            echo "❌ No dashboard.html found - this should not happen"
            exit 1
          fi

          # Copy results.json (either current or empty fallback)
          if [ -f "results-data/results.json" ]; then
            cp results-data/results.json ./pages/results.json
            echo "✅ Copied results.json"
          else
            echo "[]" > ./pages/results.json
            echo "✅ Created empty results.json fallback"
          fi

          # Copy historical runs data
          if [ -d "runs" ]; then
            cp -r runs ./pages/
            echo "✅ Copied historical runs data"
          else
            mkdir -p ./pages/runs
            echo "✅ Created empty runs directory"
          fi

          # Copy logs (if any)
          if [ -d "logs" ]; then
            cp -r logs ./pages/
            echo "✅ Copied logs"
          else
            mkdir -p ./pages/logs
            echo "✅ Created empty logs directory"
          fi

          # List what we're uploading
          echo "Pages directory contents:"
          find ./pages -type f | head -30
          echo ""
          echo "🔍 Detailed directory structure:"
          echo "📁 ./pages structure:"
          ls -la ./pages/
          echo ""
          echo "📁 ./pages/logs structure:"
          if [ -d "./pages/logs" ]; then
            find ./pages/logs -type f -name "*.log" | head -10
            echo "📊 Log file count: $(find ./pages/logs -name "*.log" | wc -l)"
            find ./pages/logs -type f -name "*.html" | head -10
            echo "📊 HTML log file count: $(find ./pages/logs -name "*.html" | wc -l)"
          else
            echo "❌ No ./pages/logs directory found!"
          fi
          echo ""
          echo "📁 ./pages/runs structure:"
          if [ -d "./pages/runs" ]; then
            ls -la ./pages/runs/
          else
            echo "❌ No ./pages/runs directory found!"
          fi
          echo ""
          echo "Checking for index.html:"
          ls -la ./pages/index.html || echo "❌ index.html not found!"
          echo "Checking for results.json:"
          ls -la ./pages/results.json || echo "❌ results.json not found!"

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Pages deployment status
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "✅ Successfully deployed to GitHub Pages!"
            echo "Dashboard URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

            # Show deployment status
            echo "📊 Dashboard deployed successfully with all available data"
          else
            echo "⚠️ Pages deployment failed"
            echo "Check the deploy step above for error details"
          fi

      - name: Upload markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.event.workflow_run.head_sha }}
          path: build-report.md
          retention-days: 30

      - name: Comment on PR (if applicable)
        if: false  # Temporarily disabled due to null pointer error - will re-enable after merge to main
        uses: actions/github-script@v7
        with:
          script: |
            // Check if this workflow run is associated with a PR
            const pullRequests = context.payload.workflow_run.pull_requests;
            if (!pullRequests || pullRequests.length === 0) {
              console.log('No pull request associated with this workflow run');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequests[0].number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Jetson Containers Build Dashboard')
            );

            const dashboardUrl = 'https://' + context.repo.owner + '.github.io/' + context.repo.repo + '/dashboard.html';
            const reportUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;

            const commentBody = `## 🚀 Jetson Containers Build Dashboard

            The build matrix has completed! View the results:

            - **📊 Interactive Dashboard:** [View Dashboard](${dashboardUrl})
            - **📋 Build Report:** [View Report](${reportUrl})

            The dashboard provides real-time filtering, search, and detailed analysis of all build results.`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequests[0].number,
                body: commentBody
              });
            }
