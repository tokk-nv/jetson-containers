name: Sweep - Publish Dashboard

on:
  workflow_run:
    workflows: ["Sweep – Build Matrix"]
    types: [completed]
    branches: [dev, main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  deployments: write

jobs:
  debug-trigger:
    name: Debug Trigger Info
    runs-on: ubuntu-latest
    steps:
      - name: Print workflow_run event details
        run: |
          echo "🔍 Workflow Run Trigger Debug Information"
          echo "========================================"
          echo "Triggering workflow: ${{ github.event.workflow_run.name }}"
          echo "Triggering run ID: ${{ github.event.workflow_run.id }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Status: ${{ github.event.workflow_run.status }}"
          echo "Event: ${{ github.event.workflow_run.event }}"
          echo "Head branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Head SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "========================================"

  publish-dashboard:
    name: Publish Dashboard
    runs-on: ubuntu-latest
    needs: [debug-trigger]
    # Accept all conclusions - we want to publish dashboard even if builds failed/timed out
    if: ${{ always() && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'cancelled') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download sweep results (including triggering run)
        env:
          DASHBOARD_PAT: ${{ secrets.DASHBOARD_PAT }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: NVIDIA-AI-IOT/jetson-containers
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "🔍 Downloading historical sweep results..."
          echo "   Matrix workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "   Matrix workflow status: ${{ github.event.workflow_run.status }}"

          # Test secret access
          if [ -n "$DASHBOARD_PAT" ]; then
            echo "✅ DASHBOARD_PAT is accessible (length: ${#DASHBOARD_PAT})"
          else
            echo "❌ DASHBOARD_PAT is not accessible"
          fi
          echo ""

          # Download all historical runs including the triggering run
          python3 .github/workflows/scripts/dashboard_download_historical_runs.py

      - name: Check if any results exist
        id: check-results
        run: |
          # Check if we have any results files in the runs directory
          if [ -d "./runs" ] && [ "$(ls -A ./runs/results-*.json 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Found $(ls -1 ./runs/results-*.json 2>/dev/null | wc -l) result files"
            ls -lh ./runs/results-*.json | tail -5
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ No result files found"
          fi

      - name: Download and process log files for all historical runs
        if: steps.check-results.outputs.exists == 'true'
        env:
          DASHBOARD_PAT: ${{ secrets.DASHBOARD_PAT }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: NVIDIA-AI-IOT/jetson-containers
        run: |
          # Process logs for ALL historical runs to build complete log history
          # TRIGGERING_RUN_ID is passed for context but we process all runs
          python3 .github/workflows/scripts/dashboard_process_log_files.py

      - name: Convert logs to HTML
        if: steps.check-results.outputs.exists == 'true'
        run: |
          # Check for log files in run-specific subdirectories (format: ./logs/run-{id}/*.log)
          if [ -d "./logs" ] && [ "$(find ./logs -type f -name '*.log' 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "🔄 Converting log files to HTML for better web viewing..."
            echo "   Found $(find ./logs -type f -name '*.log' 2>/dev/null | wc -l) log files"
            echo "📂 Log directory structure:"
            ls -lah ./logs/
            echo ""
            echo "📁 Subdirectories and files:"
            find ./logs -type d | head -10
            echo ""
            python3 .github/workflows/scripts/log_to_html_converter.py ./logs/
            echo ""
            echo "✅ Log conversion completed"
            echo "📊 HTML files created:"
            find ./logs -name "*.html" -type f | wc -l
            echo "📋 Sample HTML files:"
            find ./logs -name "*.html" -type f | head -5
          else
            echo "ℹ️  No log files to convert"
            echo "🔍 Debug: Checking what exists in ./logs"
            ls -lah ./logs/ 2>/dev/null || echo "  ./logs directory does not exist"
          fi

      - name: Generate dashboard HTML
        if: steps.check-results.outputs.exists == 'true'
        run: |
          python3 .github/workflows/scripts/dashboard_generate_html.py

      - name: Generate markdown report
        if: steps.check-results.outputs.exists == 'true'
        run: |
          # Generate report for the latest (triggering) run
          LATEST_RUN=$(ls -t ./runs/results-*.json | head -1)
          if [ -f "$LATEST_RUN" ]; then
            echo "📊 Generating report for: $LATEST_RUN"
            python3 .github/workflows/scripts/dashboard_generate_report.py "$LATEST_RUN"
          else
            echo "⚠️  No result file found for report generation"
          fi

      - name: Setup Pages
        if: steps.check-results.outputs.exists == 'true'
        uses: actions/configure-pages@v4
        with:
          enablement: true
        continue-on-error: true

      - name: Download existing logs from GitHub Pages
        if: steps.check-results.outputs.exists == 'true'
        continue-on-error: true
        run: |
          echo "📥 Downloading existing logs from GitHub Pages to preserve them..."
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

          # Create temporary directory for existing logs
          mkdir -p ./existing-logs

          # Try to download existing logs directory structure
          # We'll use wget to mirror the logs directory
          wget --mirror --no-parent --no-host-directories --cut-dirs=1 \
               --accept="*.log,*.html" --reject="index.html" \
               -P ./existing-logs \
               "${PAGES_URL}/logs/" 2>&1 || echo "⚠️ Could not download existing logs (might be first run)"

          if [ -d "./existing-logs/logs" ]; then
            echo "✅ Downloaded existing logs"
            ls -la ./existing-logs/logs/
          else
            echo "ℹ️ No existing logs found (this might be the first dashboard run)"
          fi

      - name: Prepare Pages directory
        if: steps.check-results.outputs.exists == 'true'
        run: |
          mkdir -p ./pages

          # Copy dashboard HTML
          if [ -f "dashboard.html" ]; then
            cp dashboard.html ./pages/index.html
            echo "✅ Copied dashboard.html to pages/index.html"
          else
            echo "❌ dashboard.html not found"
          fi

          # Copy all historical runs
          if [ -d "./runs" ]; then
            cp -r runs ./pages/
            echo "✅ Copied runs directory ($(ls -1 ./runs/results-*.json 2>/dev/null | wc -l) files)"
          else
            mkdir -p ./pages/runs
            echo "⚠️  No runs directory found, created empty"
          fi

          # Merge logs: Start with existing logs from Pages, then add/update with new logs
          mkdir -p ./pages/logs

          # First, copy existing logs from GitHub Pages
          if [ -d "./existing-logs/logs" ]; then
            echo "📋 Merging existing logs from GitHub Pages..."
            cp -r ./existing-logs/logs/* ./pages/logs/ 2>/dev/null || true
            echo "✅ Copied $(find ./existing-logs/logs -type f 2>/dev/null | wc -l) existing log files"
          fi

          # Then, overlay new logs (will overwrite if run IDs match, preserving old runs)
          if [ -d "./logs" ]; then
            echo "📋 Adding new logs for current run..."
            echo "🔍 Before copy - logs structure:"
            find ./logs -type d | sort
            cp -r ./logs/* ./pages/logs/ 2>/dev/null || true
            echo "✅ Added new log files"
            echo "🔍 After copy - pages/logs structure:"
            find ./pages/logs -type d | sort | head -20
          else
            echo "⚠️  No new logs directory found"
          fi

          echo "📊 Total logs after merge: $(find ./pages/logs -type f 2>/dev/null | wc -l) files"
          echo "📋 By type:"
          echo "   .log files: $(find ./pages/logs -name '*.log' -type f 2>/dev/null | wc -l)"
          echo "   .html files: $(find ./pages/logs -name '*.html' -type f 2>/dev/null | wc -l)"

          # List what we're uploading
          echo ""
          echo "📦 Pages directory summary:"
          echo "📁 Dashboard: $([ -f ./pages/index.html ] && echo '✅' || echo '❌') index.html"
          echo "📁 Runs: $(ls -1 ./pages/runs/results-*.json 2>/dev/null | wc -l) result files"
          if [ -d "./pages/logs" ]; then
            echo "📁 Logs: $(find ./pages/logs -name "*.log" 2>/dev/null | wc -l) .log files, $(find ./pages/logs -name "*.html" 2>/dev/null | wc -l) .html files"
          fi

          echo ""
          echo "📋 Recent runs included:"
          ls -1t ./pages/runs/results-*.json 2>/dev/null | head -5 | xargs -I {} basename {} | sed 's/^/  - /'

      - name: Upload Pages artifact
        if: steps.check-results.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        if: steps.check-results.outputs.exists == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Pages deployment status
        if: steps.check-results.outputs.exists == 'true'
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "✅ Successfully deployed to GitHub Pages!"
            echo "Dashboard URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          else
            echo "⚠️ Pages deployment failed"
            echo "Check the deploy step above for error details"
          fi

      - name: Upload markdown report
        if: steps.check-results.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.event.workflow_run.head_sha }}
          path: build-report.md
          retention-days: 30

      - name: Comment on PR (if applicable)
        if: false  # Temporarily disabled due to null pointer error - will re-enable after merge to main
        uses: actions/github-script@v7
        with:
          script: |
            // Check if this workflow run is associated with a PR
            const pullRequests = context.payload.workflow_run.pull_requests;
            if (!pullRequests || pullRequests.length === 0) {
              console.log('No pull request associated with this workflow run');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequests[0].number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Jetson Containers Build Dashboard')
            );

            const dashboardUrl = 'https://' + context.repo.owner + '.github.io/' + context.repo.repo + '/dashboard.html';
            const reportUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;

            const commentBody = `## 🚀 Jetson Containers Build Dashboard

            The build matrix has completed! View the results:

            - **📊 Interactive Dashboard:** [View Dashboard](${dashboardUrl})
            - **📋 Build Report:** [View Report](${reportUrl})

            The dashboard provides real-time filtering, search, and detailed analysis of all build results.`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequests[0].number,
                body: commentBody
              });
            }
